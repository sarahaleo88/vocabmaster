<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4A90A4">
    <meta name="description" content="VocabMaster - 英语词汇闪卡应用，基于SM-2间隔重复记忆法">
    <title>VocabMaster - 智能单词记忆</title>
    <style>
        :root {
            --primary: #4A90A4;
            --primary-dark: #3A7A94;
            --secondary: #E8B86D;
            --bg: #F5F7FA;
            --text: #2C3E50;
            --text-light: #7F8C8D;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #E8EFF5 100%);
            min-height: 100vh;
            color: var(--text);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 24px;
            text-align: center;
        }

        .logo {
            font-size: 5rem;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .tagline {
            font-size: 1.25rem;
            color: var(--text-light);
            margin-bottom: 48px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            margin-bottom: 48px;
            text-align: left;
        }

        .feature {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 12px;
        }

        .feature h3 {
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .feature p {
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 18px 36px;
            border-radius: 12px;
            font-size: 1.125rem;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(74, 144, 164, 0.4);
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(74, 144, 164, 0.5);
        }

        .install-guide {
            margin-top: 48px;
            padding: 32px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: left;
        }

        .install-guide h2 {
            font-size: 1.25rem;
            margin-bottom: 16px;
            color: var(--primary);
        }

        .install-guide ol {
            margin-left: 20px;
            line-height: 2;
            color: var(--text-light);
        }

        footer {
            margin-top: 48px;
            color: var(--text-light);
            font-size: 0.875rem;
        }

        footer a {
            color: var(--primary);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">📚</div>
        <h1>VocabMaster</h1>
        <p class="tagline">智能英语词汇闪卡，科学间隔重复记忆</p>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">🧠</div>
                <h3>SM-2 算法</h3>
                <p>基于科学记忆曲线，智能安排复习时间</p>
            </div>
            <div class="feature">
                <div class="feature-icon">📱</div>
                <h3>离线使用</h3>
                <p>所有数据存储在本地，无需网络连接</p>
            </div>
            <div class="feature">
                <div class="feature-icon">📦</div>
                <h3>内置词库</h3>
                <p>100+ 精选高频词汇和编程术语</p>
            </div>
            <div class="feature">
                <div class="feature-icon">📥</div>
                <h3>自由导入</h3>
                <p>支持 CSV/JSON 格式灵活导入词汇</p>
            </div>
        </div>

        <a href="https://github.com/your-repo/vocabmaster/releases" class="download-btn">
            ⬇️ 下载 APK
        </a>

        <div class="install-guide">
            <h2>📲 安装指南</h2>
            <ol>
                <li>点击上方按钮下载 APK 文件</li>
                <li>打开手机设置 → 安全 → 允许安装未知来源应用</li>
                <li>打开下载的 APK 文件进行安装</li>
                <li>安装完成后即可开始使用！</li>
            </ol>
        </div>

        <footer>
            <p>开源项目 · <a href="https://github.com/your-repo/vocabmaster">GitHub</a></p>
        </footer>
    </div>
</body>

</html>
